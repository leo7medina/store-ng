<div class="flex space-x-4 mt-5">
  <div class="w-56">
    <p>Status loading: {{ categoriesResource.isLoading() }}</p>
    <button
      class="bg-blue-500 text-white px-4 py-2 rounded-md"
      (click)="reloadCategories()"
    >
      Reload categories
    </button>
    <button
      class="bg-blue-500 text-white px-4 py-2 rounded-md"
      (click)="resetCategories()"
    >
      Reset categories
    </button>
    <button
      class="bg-blue-500 text-white px-4 py-2 rounded-md"
      (click)="reloadProducts()"
    >
      Reload products
    </button>
    <ul>
      <li>
        <a routerLink="/">All</a>
      </li>

      @for (category of categoriesResource.value(); track category) {
        <li>
          <a [routerLink]="['/category', category.slug]">{{ category.name }}</a>
        </li>
      }
    </ul>
    <h3>Total items carrito: {{ cart().length }}</h3>
  </div>
  <div class="grid grid-cols-4 gap-8 w-full">
    @for (product of productsResource.value(); track product) {
      <app-product-item [product]="product" (addToCart)="addToCart($event)" />
    }
  </div>
</div>
